# Builds the server image from the Dockerfile and publishes it to GHCR for a release tag.
#
#   ghcr.io/crueber/scriobh:<tag>        the release tag's own name (v1.2.3)
#   ghcr.io/crueber/scriobh:<version>    the same without the v (1.2.3)
#   ghcr.io/crueber/scriobh:<short sha>  the commit, seven characters
#   ghcr.io/crueber/scriobh:latest       only for a release tag without a prerelease suffix (v1.2.3, not v1.2.3-rc.1),
#                                           never for a branch
#
# Written from the development repository's image job (which uses buildah because it has no Docker
# daemon) and NOT run on GitHub when it was made; checked only for valid YAML. After the first run,
# make the package public (the repository's Packages, Package settings) if anonymous pulls should work.
name: docker image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5.10.0
        with:
          images: ghcr.io/crueber/scriobh
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - uses: docker/login-action@v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6.19.2
        with:
          context: .
          push: true
          build-args: |
            TAGS=prod
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
