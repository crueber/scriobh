# Deploys the landing page, the files under landing/, to GitHub Pages at https://crueber.github.io/scriobh/.
#
#   push to main that changes landing/      builds and deploys the page
#   a release is published                  deploys it again, so the download links name the new files
#   the release workflow finishes           the same, because a Release made with the workflow token starts nothing
#   Actions -> pages -> Run workflow        deploys what main holds now
#
# The page is plain HTML and CSS with no build step. The "build" job copies the demo video in from docs/media, writes the
# real download links of the latest release into landing/index.html (scripts/landing-downloads.py, from
# `gh release view`), and uploads the folder as the Pages artifact. The visitor's browser asks nobody for those links: they
# are in the page. The step FAILS, and nothing deploys, when an expected file is missing from the release, so the page
# never goes up with a dead link; on a release event it retries for a few minutes first, because the files are attached
# after the Release is published. The page makes no request to any other site, and the Content-Security-Policy in each
# page says so; scripts/publish-check.sh does not run the page, it checks this workflow, the script and the files.
#
# ONE-TIME SETUP, by the repository's owner, because a workflow cannot do it with its own token: Pages must be set to
# deploy from GitHub Actions (Settings, Pages, Build and deployment, Source: GitHub Actions), or with the CLI:
#
#   gh api -X POST repos/crueber/scriobh/pages -f build_type=workflow
#   (if the site already exists:  gh api -X PUT repos/crueber/scriobh/pages -f build_type=workflow)
#
# Until that is done, the first run fails in the configure-pages step with "Get Pages site failed"; re-run it after.
#
# Written with the development repository's other templates and NOT run on GitHub when it was made; checked only with
# actionlint and a YAML parser. The three Pages actions are pinned to a combination that works together: the
# upload-pages-artifact v3 artifact is the one deploy-pages v4 reads. A new major of either needs the other checked.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - "docs/media/demo.*"
      - "scripts/landing-downloads.py"
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  # A Release that the release workflow makes with its own token does not start the `release` event above (GitHub does not
  # run workflows for events made with GITHUB_TOKEN), but the end of that workflow's run starts this one.
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits for the running one instead of cancelling it half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # configure-pages reads the Pages site through the API, which the workflow's contents-only token cannot; a job's own
    # permissions replace the workflow's, so contents is repeated. (The official starter workflows grant pages: write
    # to the whole workflow.)
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4.2.2

      # The demo video lives once, in docs/media (the README plays it from there); Pages serves only what is uploaded, so
      # it is copied next to the page's pictures here, at deploy time. landing/.gitignore keeps a local copy out of git.
      - name: Add the demo video to the page
        run: |
          set -eu
          for v in demo.mp4 demo.webm; do
            test -s "docs/media/$v"
            cp "docs/media/$v" "landing/media/$v"
          done

      # The links come from the latest Release (the newest that is neither a draft nor a pre-release), read with the
      # workflow's own token. A push or a manual run reads it once; a release event waits up to ten minutes for the files.
      - name: Write the latest release's download links into the page
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          tries=1
          case "$EVENT" in release|workflow_run) tries=20 ;; esac
          i=1
          while :; do
            gh release view --json tagName,isPrerelease,assets >release.json
            if python3 scripts/landing-downloads.py release.json landing/index.html; then break; fi
            [ "$i" -lt "$tries" ] || { echo "the latest release does not have every file the page links to; not deploying" >&2; exit 1; }
            i=$((i + 1))
            sleep 30
          done
          rm -f release.json

      - uses: actions/configure-pages@v5.0.0

      - uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: landing

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4.0.5
